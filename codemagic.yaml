workflows:
  kremityss-ios-unsigned:
    name: Kremityss AI iOS unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Generate launcher icons and native splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Generate iOS Flutter build files
        script: flutter build ios --release --config-only
      - name: Build unsigned iPhoneOS app
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package unsigned iOS app
        script: |
          mkdir -p artifacts
          mkdir -p Payload
          cp -R build/ios/device/Build/Products/Release-iphoneos/Runner.app Payload/Runner.app
          zip -qr artifacts/Kremityss-AI-unsigned-ios.ipa Payload
    artifacts:
      - artifacts/Kremityss-AI-unsigned-ios.ipa
      - build/ios/device/Build/Products/Release-iphoneos/Runner.app

  kremityss-android:
    name: Kremityss AI Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Generate launcher icons and native splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
